<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⋆｡‧˚ʚ🍓ɞ˚‧｡⋆</title>
<style>
html,body{margin:0;height:100%;background:#1b1d29;overflow:hidden}
#s,#m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;line-height:1.15;white-space:pre;color:#fff}
#s{margin:0;position:absolute;top:0;left:0}
#m{position:absolute;visibility:hidden;display:inline-block}
</style>
</head>
<body>
<pre id="s"></pre><span id="m"></span>
<script>
const MESSAGE="for my pretty princess",NUM_HEARTS=18,SPIN=.6,TILT=.3,CAM=4,PIVOT=.2;
const WHITE=[244,248,251,254,255,231],PINK=[168,175,205,211,218,225],GOLD=[94,136,178,214,220],
GREENS=[22,28,28,34,35,71,77,114],PAPER=[101,144,187,223,230,231],RIBBON=[88,125,161,197,204,211],
HEARTC=[161,197,204,205,211,218],MSGC=[161,168,205,211,218,225,218,211,205,168],
SHADE=".:-=+*%@",PSHADE="+*#%",DISC=[[WHITE,GOLD,14],[PINK,GOLD,12]];
const _l=Math.hypot(-.45,.6,.66),LX=-.45/_l,LY=.6/_l,LZ=.66/_l;
const HEX=[];for(let n=0;n<256;n++){let r,g,b;if(n<16)r=g=b=136;else if(n<232){const m=n-16,v=x=>x?55+40*x:0;r=v(Math.floor(m/36));g=v(Math.floor(m/6)%6);b=v(m%6)}else r=g=b=8+10*(n-232);HEX.push("#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join(""))}
const norm=v=>{const m=Math.hypot(...v)||1;return[v[0]/m,v[1]/m,v[2]/m]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const add=(p,d,k)=>[p[0]+d[0]*k,p[1]+d[1]*k,p[2]+d[2]*k];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function build(){
const r=rng(21),U=(a,b)=>a+(b-a)*r(),pts=[],neck=[0,-.12,0],C=[0,.12,0],D=.64,N=10,gold=Math.PI*(3-Math.sqrt(5)),heads=[],flowers=[];
for(let i=0;i<N;i++){const el=(88-60*Math.sqrt(i/(N-1)))*Math.PI/180,az=i*gold,d=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];heads.push([add(C,d,D*U(.92,1.05)),norm(d)])}
heads.forEach(([pos,ax],idx)=>{const b=add(pos,ax,-.03);
for(let j=0;j<70;j++){const t=j/69;pts.push([b[0]+(neck[0]-b[0])*t,b[1]+(neck[1]-b[1])*t,b[2]+(neck[2]-b[2])*t,ax[0],0,ax[2],GREENS,-.15,true,null])}
const[pal,cen,n]=DISC[idx%2];flowers.push([pos,pal,cen,n,U(.13,.15),U(0,6.28)])});
for(let i=0;i<8;i++){const a=(i+.4)/8*2*Math.PI,c=Math.cos(a),s=Math.sin(a),b=[.26*c,.3,.26*s],d=norm([c,.15,s]),sd=[-s,0,c],n=norm(cross(sd,d)),L=.3,W=.07;
for(let ti=0;ti<32;ti++){const t=ti/31;for(let wi=-5;wi<=5;wi++){const w=wi/5,cu=.025*w*w,sw=W*Math.sin(Math.PI*t)*w;
pts.push([b[0]+d[0]*L*t+sd[0]*sw+n[0]*cu,b[1]+d[1]*L*t-.1*t*t+n[1]*cu,b[2]+d[2]*L*t+sd[2]*sw+n[2]*cu,n[0],n[1],n[2],GREENS,wi==0?-.25:0,true,null])}}}
const y0=-.2,y1=.3,r0=.06,r1=.36,k=(r1-r0)/(y1-y0);
for(let i=0;i<50;i++){const t=i/49,rr=r0+(r1-r0)*t,cnt=Math.max(8,Math.trunc(170*rr));
for(let j=0;j<cnt;j++){const ph=(j+r())/cnt*2*Math.PI,c=Math.cos(ph),s=Math.sin(ph);let y=y0+(y1-y0)*t;if(t>.9)y+=.03*Math.sin(9*ph);
const nn=norm([c,-k,s]);pts.push([rr*c,y,rr*s,nn[0],nn[1],nn[2],PAPER,.3*(Math.abs(Math.sin(5*ph))-.6),false,null])}}
for(let i=0;i<7;i++){const a=i/7*2*Math.PI,sx=.025*Math.cos(a),sz=.025*Math.sin(a);
for(let j=0;j<40;j++){const t=j/39;pts.push([sx*(1+1.2*t),-.2-.3*t,sz*(1+1.2*t),Math.cos(a),0,Math.sin(a),GREENS,-.1,true,null])}}
const by=-.12,br=r0+k*(by-y0)+.01,kz=br+.01;
for(let j=0;j<90;j++){const ph=j/90*2*Math.PI;for(const dy of[-.012,0,.012])pts.push([br*Math.cos(ph),by+dy,br*Math.sin(ph),Math.cos(ph),0,Math.sin(ph),RIBBON,0,false,null])}
for(const sd of[-1,1]){
for(let j=0;j<70;j++){const a=j/70*2*Math.PI,lx=sd*(.07+.07*Math.cos(a)),ly=.04*Math.sin(a)+.02*(.07+.07*Math.cos(a))/.14;
for(const f of[1,.7])pts.push([lx*f,by+ly*f,kz+.01,sd*.3,.2,.93,RIBBON,.1,true,null])}
for(let j=0;j<30;j++){const t=j/29;pts.push([sd*.06*t,by-.15*t,kz+.015,sd*.2,0,.98,RIBBON,-.05+.05*Math.sin(t*9),true,null])}}
for(const dx of[-.01,0,.01])pts.push([dx,by,kz+.02,0,0,1,RIBBON,.2,true,"@"]);
const babies=[],sparkles=[];
for(let i=0;i<90;i++){const a=r()*2*Math.PI,el=U(.3,1.4),rr=U(.4,.58);babies.push([rr*Math.cos(a)*Math.cos(el),C[1]+rr*Math.sin(el),rr*Math.sin(a)*Math.cos(el),U(0,6.28)])}
for(let i=0;i<30;i++){const a=r()*2*Math.PI,rr=U(.75,.95);sparkles.push([rr*Math.cos(a),U(-.3,1),rr*Math.sin(a),U(0,6.28),U(1.5,4)])}
return{pts,flowers,babies,sparkles}}

const scene=build(),hearts=[],pre=document.getElementById("s"),mm=document.getElementById("m");
let cols=80,rows=30,cw=8,chh=15;
function fit(){const fs=innerWidth<600?9:13;pre.style.fontSize=mm.style.fontSize=fs+"px";mm.textContent="MMMMMMMMMM";
const b=mm.getBoundingClientRect();cw=b.width/10;chh=b.height;cols=Math.max(20,Math.floor(innerWidth/cw)-1);rows=Math.max(12,Math.floor(innerHeight/chh)-1);
pre.style.left=Math.max(0,(innerWidth-cols*cw)/2)+"px"}
addEventListener("resize",fit);fit();

function render(t,dt){
while(hearts.length<NUM_HEARTS)hearts.push([Math.random(),1+Math.random(),.03+Math.random()*.05,Math.random()*6.28,HEARTC[Math.floor(Math.random()*HEARTC.length)]]);
for(const h of hearts){h[1]-=h[2]*dt;if(h[1]<0){h[0]=Math.random();h[1]=1;h[4]=HEARTC[Math.floor(Math.random()*HEARTC.length)]}}
const view=rows-2,scale=Math.max(1,Math.min((view-2)/1.45,(cols-2)/2.7)),sxs=scale*2,cx=cols/2,cy=1+.78*scale,ang=t*SPIN,ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(TILT),st=Math.sin(TILT);
const n=cols*rows,ch=new Array(n).fill(" "),co=new Uint8Array(n),zb=new Float32Array(n).fill(-1e9);
const P=(x,y,z)=>{const xr=x*ca-z*sa,zr=x*sa+z*ca,yp=y-PIVOT,yt=yp*ct-zr*st,zt=yp*st+zr*ct,f=CAM/(CAM-zt);return[cx+xr*f*sxs,cy-yt*f*scale,zt,f]};
const plot=(c,r,z,k,color)=>{if(r>=0&&r<view&&c>=0&&c<cols){const i=r*cols+c;if(z>zb[i]){zb[i]=z;ch[i]=k;co[i]=color}}};
for(const[x,y,,ph,color]of hearts){const c=(((Math.trunc((x+.015*Math.sin(t*1.2+ph))*cols))%cols)+cols)%cols;plot(c,Math.trunc(y*view),-50,"♥",color)}
for(const[x,y,z,nx,ny,nz,pal,tone,two,ov]of scene.pts){const[fx,fy,zt]=P(x,y,z),nxr=nx*ca-nz*sa,nzr=nx*sa+nz*ca,nyt=ny*ct-nzr*st,nzt=ny*st+nzr*ct;
let dot=nxr*LX+nyt*LY+nzt*LZ;if(two&&dot<0)dot=-dot*.55;
const b=Math.min(.999,Math.max(0,.25+.75*Math.max(0,dot)+tone));
plot(Math.trunc(fx),Math.trunc(fy),zt,ov||SHADE[Math.trunc(b*SHADE.length)],pal[Math.trunc(b*pal.length)])}
for(const[pos,pal,cpal,np,R,seed]of scene.flowers){const[fx,fy,zt,f]=P(...pos),rx=R*f*sxs,ry=R*f*scale,dim=-.4*(1-Math.min(1,Math.max(0,(zt+.6)/1.2))),rot=seed+ang*.7;
for(let row=Math.trunc(fy-ry)-1;row<Math.trunc(fy+ry)+2;row++){const dy=(row+.5-fy)/ry;
for(let col=Math.trunc(fx-rx)-1;col<Math.trunc(fx+rx)+2;col++){const dx=(col+.5-fx)/rx,s=Math.hypot(dx,dy);if(s>1)continue;
if(s<.3){const b=Math.min(.999,Math.max(0,.55-.35*dx-.35*dy+dim));plot(col,row,zt+.06,s<.17?"@":"o",cpal[Math.trunc(b*cpal.length)]);continue}
const reach=.3+.7*Math.pow(Math.abs(Math.cos(np*(Math.atan2(dy,dx)+rot)/2)),1.3);if(s>reach)continue;
const edge=s>reach-.14?-.22:0,b=Math.min(.999,Math.max(0,.62-.22*dx-.28*dy+.12*s+edge+dim));
plot(col,row,zt+.04*(1-s),PSHADE[Math.trunc(b*PSHADE.length)],pal[Math.trunc(b*pal.length)])}}}
for(const[x,y,z,ph]of scene.babies){const[fx,fy,zt]=P(x,y,z),star=Math.sin(t*2+ph)>.6;plot(Math.trunc(fx),Math.trunc(fy),zt+.02,star?"*":"·",star?231:255)}
for(const[x,y,z,ph,sp]of scene.sparkles){const[fx,fy,zt]=P(x,y,z),tw=Math.sin(t*sp+ph),c=Math.trunc(fx),r=Math.trunc(fy);
if(tw>.85)plot(c,r,zt,"*",231);else if(tw>.4)plot(c,r,zt,"+",225);else if(tw>0)plot(c,r,zt,"·",218)}
const shift=Math.trunc(t*6),ms=Math.max(0,Math.floor((cols-MESSAGE.length)/2));
[...MESSAGE].forEach((k,i)=>{if(ms+i<cols){ch[(rows-2)*cols+ms+i]=k;co[(rows-2)*cols+ms+i]=MSGC[(i+shift)%MSGC.length]}});
const hint="Te amo montones estrellita",hs=Math.max(0,Math.floor((cols-hint.length)/2));
[...hint].forEach((k,i)=>{if(hs+i<cols){ch[(rows-1)*cols+hs+i]=k;co[(rows-1)*cols+hs+i]=238}});
let out="";
for(let r=0;r<rows;r++){let cur=-1;for(let c=0;c<cols;c++){const i=r*cols+c,k=ch[i],cc=co[i];if(k===" "){out+=" ";continue}
if(cc!==cur){if(cur!==-1)out+="</span>";out+='<span style="color:'+HEX[cc]+'">';cur=cc}out+=k}
if(cur!==-1)out+="</span>";out+="\n"}
pre.innerHTML=out}

let t0=performance.now(),last=t0,lastR=0;
function loop(now){requestAnimationFrame(loop);if(now-lastR<1000/24)return;const dt=Math.min(.1,(now-last)/1000);last=now;lastR=now;render((now-t0)/1000,dt)}
requestAnimationFrame(loop);
</script>
</body>
</html>
